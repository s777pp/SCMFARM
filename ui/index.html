<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCMFARM</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- Our own title bar (the window has no Windows frame): drag to move, double-click to maximise. -->
    <header class="top" id="titlebar">
      <div class="brand"><img src="img/logo.png" alt=""><b>SCM<span>FARM</span></b></div>
      <div class="chip" id="engineChip" data-tone="busy"><i></i><span data-i18n="engine.checking"></span></div>
      <nav class="toolnav" id="toolNav" hidden></nav>
      <div class="top__right">
        <span class="demo-badge" id="demoBadge" data-i18n="app.demo" hidden></span>
        <button class="btn btn--sm" id="btnSettings" data-i18n="app.settings" hidden></button>
        <div class="accounts" id="accounts" hidden></div>
        <div class="lang" id="lang">
          <button class="lang__btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg>
            <span class="lang__name"></span>
            <svg class="lang__chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="lang__menu" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="wc" id="winCtl" hidden>
        <button type="button" data-win="min" aria-label="Minimize"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6.5h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button type="button" data-win="max" aria-label="Maximize"><svg class="wc__max" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><svg class="wc__restore" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="4" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 4V3a1 1 0 0 1 1-1H9a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button type="button" data-win="close" class="wc__close" aria-label="Close"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <main id="view"></main>
    <!-- Shown at start while a newer SCMFARM is downloaded; the app then restarts into it. -->
    <section class="upd" id="updating" hidden>
      <div class="upd__card">
        <img src="img/logo.png" alt="">
        <h2 class="upd__title"></h2>
        <p class="upd__lead"></p>
        <div class="bar"><i id="updBar"></i></div>
        <p class="upd__pct"></p>
      </div>
    </section>
    <footer class="foot">
      <button class="link link--about" id="btnAbout"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-i18n="app.about"></span></button>
      <span class="foot__sep">·</span>
      <span data-i18n="app.poweredBy"></span>
      <span>· Apache-2.0</span>
      <span class="spacer"></span>
      <button class="link link--site" data-href="https://showcasemaker.com">showcasemaker.com</button>
    </footer>
  </div>

  <!-- Our own yes / no window (the WebView's confirm() looks like a browser page). -->
  <dialog id="ask" class="ask">
    <h2 class="ask__title"></h2>
    <p class="ask__text"></p>
    <form method="dialog" class="ask__bar">
      <button class="btn" value="no" data-i18n="app.cancel"></button>
      <button class="btn btn--danger" value="yes" id="askYes"></button>
    </form>
  </dialog>

  <!-- The user's own Telegram bot for notifications: the token stays on this PC, messages go straight to Telegram. -->
  <dialog id="tg" class="tg">
    <h2 class="title title--sm"><span data-i18n="telegram.title"></span></h2>
    <p data-i18n="telegram.lead"></p>
    <ol class="tg__steps"></ol>
    <label class="field"><span data-i18n="telegram.token"></span>
      <input class="input" id="tgToken" autocomplete="off" spellcheck="false" placeholder="123456789:AA…"></label>
    <div class="tg__bar">
      <button class="btn btn--primary" type="button" data-action="tg-link" data-i18n="telegram.link"></button>
      <button class="btn" type="button" data-action="tg-test" data-i18n="telegram.test"></button>
      <button class="btn btn--quiet" type="button" data-action="tg-off" id="tgOff" data-i18n="telegram.off"></button>
    </div>
    <p id="tgStatus" hidden></p>
    <form method="dialog"><button class="btn" data-i18n="app.close"></button></form>
  </dialog>

  <dialog id="about">
    <h2 class="title title--sm"><span data-i18n="about.title"></span></h2>
    <p data-i18n="about.body"></p>
    <p data-i18n="about.license"></p>
    <p data-i18n="about.privacy"></p>
    <p id="aboutVersion"></p>
    <p id="aboutEngine"></p>
    <p><button class="link" data-href="https://github.com/JustArchiNET/ArchiSteamFarm" data-i18n="about.repo"></button></p>
    <div class="about__actions">
      <button class="btn btn--sm" type="button" data-action="open-licenses" data-i18n="about.licenses"></button>
      <button class="btn btn--sm btn--danger" type="button" data-action="remove-pc" data-i18n="remove.button"></button>
    </div>
    <form method="dialog"><button class="btn" data-i18n="app.close"></button></form>
  </dialog>
</body>
</html>
