# Builds SCMFARM.exe (a single portable exe, no installer) from this repository on GitHub-hosted runners, so every
# published binary can be traced to a commit (SignPath Foundation requirement, see README "Code signing policy").
# A tag "v<version>" also publishes a GitHub release with SCMFARM.exe and latest.json (signed update manifest);
# showcasemaker.com mirrors that release for downloads and for the app's self-update.
name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating the release on tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check product name and version
        run: node scripts/check-version.mjs

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Install JS dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build exe
        run: npm run build

      - name: Upload unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: SCMFARM-unsigned
          path: src-tauri/target/release/SCMFARM.exe
          if-no-files-found: error

      # Once SignPath Foundation has accepted the project, uncomment this step (values from the SignPath project page)
      # and point the steps below at the signed file. Every signing request is then approved by hand in SignPath.
      # - name: Sign with SignPath
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <organization id>
      #     project-slug: scmfarm
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed

      - name: Signed update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: node scripts/sign-release.mjs src-tauri/target/release/SCMFARM.exe latest.json "${{ github.ref_name }}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/SCMFARM.exe
            latest.json
          generate_release_notes: true
